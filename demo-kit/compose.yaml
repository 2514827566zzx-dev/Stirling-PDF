name: stirling-pdf-demo

services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:3.2.0
    restart: unless-stopped
    environment:
      DISABLE_ADDITIONAL_FEATURES: "true"
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_DEFAULTLOCALE: zh-CN
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DEMO_PORT:-3104}:8080"
    volumes:
      - configs:/configs
      - logs:/logs
      - custom_files:/customFiles
      - pipeline:/pipeline
      - storage:/storage
      - tessdata:/usr/share/tessdata
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/info/status | grep -q UP"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  configs:
  logs:
  custom_files:
  pipeline:
  storage:
  tessdata:
